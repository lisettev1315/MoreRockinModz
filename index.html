<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morerockstarmods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slam {
      0% { transform: scale(0) rotate(-30deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }
    header h1 {
      animation: slam 1s ease forwards;
    }
    .fade-section {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .zoom-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .zoom-hover:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .dash-effect:active {
      animation: dash 0.3s linear;
    }
    @keyframes dash {
      from { letter-spacing: 0px; }
      to { letter-spacing: 4px; }
    }
  </style>
</head>
<body class="bg-black text-green-500">
  <header class="text-center py-6">
    <h1 class="text-5xl font-bold tracking-widest">Morerockstarmods</h1>
  </header>

  <section class="fade-section max-w-4xl mx-auto p-4 text-center">
    <h2 class="text-3xl font-bold dash-effect">About Me</h2>
    <p class="mt-4 text-lg">Welcome to Morerockstarmods! I create and share cool Rockstar mods with a retro twist.</p>
  </section>

  <section class="fade-section max-w-4xl mx-auto p-4 text-center">
    <h2 class="text-3xl font-bold dash-effect">Shop</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <div class="bg-gray-900 p-4 rounded-2xl zoom-hover">
        <img src="https://via.placeholder.com/200" class="mx-auto rounded-xl" alt="Item 1">
        <p class="mt-2 text-lg">Item 1</p>
        <button onclick="addToCart('Item 1')" class="bg-green-500 text-black px-4 py-2 rounded-lg mt-2">Add to Cart</button>
      </div>
      <div class="bg-gray-900 p-4 rounded-2xl zoom-hover">
        <img src="https://via.placeholder.com/200" class="mx-auto rounded-xl" alt="Item 2">
        <p class="mt-2 text-lg">Item 2</p>
        <button onclick="addToCart('Item 2')" class="bg-green-500 text-black px-4 py-2 rounded-lg mt-2">Add to Cart</button>
      </div>
      <div class="bg-gray-900 p-4 rounded-2xl zoom-hover">
        <img src="https://via.placeholder.com/200" class="mx-auto rounded-xl" alt="Item 3">
        <p class="mt-2 text-lg">Item 3</p>
        <button onclick="addToCart('Item 3')" class="bg-green-500 text-black px-4 py-2 rounded-lg mt-2">Add to Cart</button>
      </div>
      <div class="bg-gray-900 p-4 rounded-2xl zoom-hover">
        <img src="https://via.placeholder.com/200" class="mx-auto rounded-xl" alt="Item 4">
        <p class="mt-2 text-lg">Item 4</p>
        <button onclick="addToCart('Item 4')" class="bg-green-500 text-black px-4 py-2 rounded-lg mt-2">Add to Cart</button>
      </div>
    </div>
  </section>

  <section class="fade-section max-w-4xl mx-auto p-4 text-center">
    <h2 class="text-3xl font-bold dash-effect">Blog</h2>
    <textarea id="commentInput" class="w-full p-2 mt-4 rounded bg-gray-800 text-white" placeholder="Write a comment..."></textarea>
    <button onclick="postComment()" class="bg-green-500 text-black px-4 py-2 rounded-lg mt-2">Post Comment</button>
    <div id="comments" class="mt-4 space-y-2"></div>
  </section>

  <div id="cart" class="hidden fixed bottom-4 right-4 bg-gray-900 text-white p-4 rounded-lg shadow-lg">
    <h3 class="text-lg font-bold mb-2">Cart</h3>
    <ul id="cartItems"></ul>
    <button onclick="clearCart()" class="bg-red-500 px-3 py-1 rounded mt-2">Clear</button>
  </div>

  <a href="https://tiktok.com" target="_blank" class="fixed bottom-4 left-4 bg-pink-500 text-white p-3 rounded-full">TikTok</a>
  <a href="https://youtube.com" target="_blank" class="fixed bottom-16 left-4 bg-red-500 text-white p-3 rounded-full">YouTube</a>
  <a href="https://modfive.com" target="_blank" class="fixed bottom-28 left-4 bg-blue-500 text-white p-3 rounded-full">ModFive</a>

  <audio id="bg-music" autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-sweet.mp3" type="audio/mpeg">
  </audio>

  <script>
    const sections = document.querySelectorAll("section");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("visible"); });
    }, { threshold: 0.2 });
    sections.forEach(section => { section.classList.add("fade-section"); observer.observe(section); });

    let cart = [];
    function addToCart(item) {
      cart.push(item);
      document.getElementById('cart').classList.remove('hidden');
      renderCart();
    }
    function renderCart() {
      const cartList = document.getElementById('cartItems');
      cartList.innerHTML = '';
      cart.forEach(i => {
        const li = document.createElement('li');
        li.textContent = i;
        cartList.appendChild(li);
      });
    }
    function clearCart() {
      cart = [];
      renderCart();
    }

    function postComment() {
      const comment = document.getElementById("commentInput").value;
      if (comment.trim() === "") return;
      const div = document.createElement("div");
      div.textContent = comment;
      div.classList.add("bg-gray-800", "p-2", "rounded");
      document.getElementById("comments").appendChild(div);
      document.getElementById("commentInput").value = "";
    }
  </script>
</body>
</html>
