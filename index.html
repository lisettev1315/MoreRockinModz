<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MoreRockStarMods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white font-[Press Start 2P]">
  <header class="text-center py-6 text-green-400 text-4xl">MoreRockStarMods</header>
  <section id="about" class="max-w-3xl mx-auto text-center py-6">
    <img src="creator-image.jpg" alt="Creator" class="mx-auto rounded-full w-40 h-40 mb-4">
    <p class="text-lg">Welcome to Morerockstarmods! I create and share cool Rockstar mods with a retro twist.</p>
  </section>

  <section id="gallery" class="max-w-4xl mx-auto py-6">
    <h2 class="text-center text-yellow-400 text-2xl mb-4">Gallery</h2>
    <div class="flex overflow-x-auto space-x-4 p-2">
      <img src="gallery1.jpg" class="rounded-lg w-60 h-40">
      <img src="gallery2.jpg" class="rounded-lg w-60 h-40">
      <img src="gallery3.jpg" class="rounded-lg w-60 h-40">
      <img src="gallery4.jpg" class="rounded-lg w-60 h-40">
    </div>
  </section>

  <section id="videos" class="max-w-4xl mx-auto py-6">
    <h2 class="text-center text-yellow-400 text-2xl mb-4">Videos</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/ysz5S6PUM-U" allowfullscreen></iframe>
      <iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      <iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/abc123" allowfullscreen></iframe>
      <iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/xyz789" allowfullscreen></iframe>
    </div>
  </section>

  <section id="shop" class="max-w-5xl mx-auto py-6">
    <h2 class="text-center text-yellow-400 text-2xl mb-4">Shop</h2>
    <div class="grid md:grid-cols-4 gap-4">
      <a href="https://etsy.com" target="_blank"><img src="shop1.jpg" class="rounded-lg w-full hover:scale-105 transition"></a>
      <a href="https://etsy.com" target="_blank"><img src="shop2.jpg" class="rounded-lg w-full hover:scale-105 transition"></a>
      <a href="https://etsy.com" target="_blank"><img src="shop3.jpg" class="rounded-lg w-full hover:scale-105 transition"></a>
      <a href="https://etsy.com" target="_blank"><img src="shop4.jpg" class="rounded-lg w-full hover:scale-105 transition"></a>
    </div>
  </section>

  <section id="blog" class="max-w-3xl mx-auto py-6">
    <h2 class="text-center text-yellow-400 text-2xl mb-4">Blog</h2>
    <textarea id="commentInput" class="w-full p-2 rounded mb-2 text-black" placeholder="Write a comment..."></textarea>
    <button onclick="postComment()" class="bg-green-500 px-3 py-1 rounded">Post Comment</button>
    <div id="comments" class="mt-4 space-y-2"></div>
  </section>

  <script>
    function postComment() {
      const comment = document.getElementById("commentInput").value;
      if (comment.trim() === "") return;
      const div = document.createElement("div");
      div.textContent = comment;
      div.classList.add("bg-gray-800", "p-2", "rounded");
      document.getElementById("comments").appendChild(div);
      document.getElementById("commentInput").value = "";
    }
  </script>
</body>
</html>
